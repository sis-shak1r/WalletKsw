
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>School Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f7f9fc; color: #2d3748; margin: 0; padding: 0; }
    .main-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; padding-bottom: 100px; }
    
    .balance-card { background: linear-gradient(135deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%); color: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(67, 100, 247, 0.25); }
    .digital-badge { background: rgba(255, 255, 255, 0.18); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.15); }
    
    /* เมนูด้านล่างแบบ Sticky Floating รองรับอุปกรณ์หน้าจอมีบาก (Safe Area) */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 75px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.06); padding-bottom: env(safe-area-inset-bottom); }
    .nav-item-btn { text-align: center; color: #64748b; font-size: 11px; cursor: pointer; border: none; background: none; transition: color 0.2s; text-decoration: none; padding: 5px 0; width: 25%; }
    .nav-item-btn i { font-size: 20px; display: block; margin-bottom: 4px; transition: transform 0.2s; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #007aff; }
    .nav-item-btn.qr-center { position: relative; top: -18px; width: 64px; height: 64px; background: linear-gradient(135deg, #007aff 0%, #0056b3 100%); color: white !important; border-radius: 50%; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .nav-item-btn.qr-center i { font-size: 24px; margin: 0; color: white; }
    
    /* Full Screen Modals */
    .fullscreen-modal { position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; height: 100%; background: #ffffff; z-index: 1050; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; padding: 24px; }
    .fullscreen-modal.active { transform: translateX(-50%) translateY(0); }
